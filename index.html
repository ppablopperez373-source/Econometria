<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#111a30;--line:#26334e;--ink:#f0f4ff;--muted:#9aa9c5;--cyan:#76e2dc;--blue:#90aaff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#1c3153 0,transparent 55%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(1080px,calc(100% - 40px));margin:auto;padding:34px 0 22px}.top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:.82rem;letter-spacing:.13em;text-transform:uppercase}.brand{color:var(--cyan);font-weight:750}.screen{min-height:72vh;display:grid;align-content:center}.menu{max-width:850px;margin:auto;width:100%}.eyebrow{color:var(--cyan);letter-spacing:.15em;text-transform:uppercase;font-size:.78rem;font-weight:700}.menu h1{font-size:clamp(2.5rem,7vw,5.5rem);line-height:.98;letter-spacing:-.065em;margin:20px 0 42px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.choice{min-height:170px;text-align:left;padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#17233d,#10182b);color:var(--ink);cursor:pointer;transition:.2s}.choice:hover,.choice:focus-visible{border-color:var(--cyan);transform:translateY(-3px);outline:none}.num{display:block;color:var(--cyan);font-size:.78rem;letter-spacing:.13em;text-transform:uppercase}.choice strong{display:block;font-size:1.35rem;margin-top:22px}.choice small{display:block;color:var(--muted);margin-top:9px;font-size:.92rem}.deck{width:100%;max-width:980px;margin:auto}.deck-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.deck-head h1{font-size:clamp(1.5rem,4vw,2.5rem);letter-spacing:-.04em;margin:6px 0}.back{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);padding:10px 15px;cursor:pointer}.back:hover{border-color:var(--cyan)}.slide{min-height:410px;border:1px solid var(--line);border-radius:24px;padding:clamp(25px,5vw,54px);background:linear-gradient(145deg,rgba(24,37,63,.96),rgba(14,22,39,.96));box-shadow:0 24px 80px #0005;display:flex;flex-direction:column;justify-content:center}.slide-label{color:var(--cyan);font-size:.78rem;letter-spacing:.15em;text-transform:uppercase;font-weight:750}.slide h2{font-size:clamp(1.6rem,4vw,2.7rem);letter-spacing:-.045em;margin:11px 0 25px}.math{font-size:clamp(1.08rem,2.2vw,1.5rem);line-height:1.8}.math .mjx-container[display="true"]{margin:.7em 0!important}.note{border-left:2px solid var(--cyan);padding:3px 0 3px 18px;margin-top:19px;color:#d9e5fa;font-size:1.03rem;line-height:1.7}.progress-row{display:flex;align-items:center;gap:15px;margin-top:20px}.arrow{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:#121d33;color:var(--ink);font-size:1.35rem;cursor:pointer}.arrow:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}.arrow:disabled{opacity:.35;cursor:default}.track{height:3px;background:var(--line);flex:1;border-radius:3px;overflow:hidden}.fill{height:100%;width:0;background:var(--cyan);transition:width .25s}.counter{font-variant-numeric:tabular-nums;color:var(--muted);min-width:64px;text-align:right;font-size:.9rem}.footer{text-align:center;color:#71809a;font-size:.78rem;margin-top:26px}.hidden{display:none!important}button{font:inherit} @media(max-width:650px){.shell{width:min(100% - 24px,1080px);padding-top:20px}.choices{grid-template-columns:1fr}.choice{min-height:110px}.choice strong{margin-top:10px}.slide{min-height:390px;padding:25px 20px}.deck-head{align-items:flex-start}.back{white-space:nowrap}.top{font-size:.7rem}}
</style></head>
<body><div class="shell"><header class="top"><span class="brand">ECONOMETRÍA</span><span>01 — 03&nbsp; / &nbsp;2023</span></header><main class="screen"><section id="menu" class="menu"><div class="eyebrow">Presentación de ejercicios</div><h1>Modelos.<br>Datos.<br>Resultados.</h1><div class="choices"><button class="choice" data-ex="0"><span class="num">Ejercicio 01</span><strong>Correlación</strong><small>Pearson · n = 1.347</small></button><button class="choice" data-ex="1"><span class="num">Ejercicio 02</span><strong>Regresión lineal</strong><small>Mínimos cuadrados ordinarios</small></button><button class="choice" data-ex="2"><span class="num">Ejercicio 03</span><strong>Distribución</strong><small>Poisson · 73 días</small></button></div></section><section id="deck" class="deck hidden"><div class="deck-head"><div><div id="exLabel" class="eyebrow"></div><h1 id="exTitle"></h1></div><button id="home" class="back">↶ &nbsp;Menú</button></div><article class="slide" aria-live="polite"><div id="stepLabel" class="slide-label"></div><h2 id="stepTitle"></h2><div id="content" class="math"></div></article><div class="progress-row"><button id="prev" class="arrow" aria-label="Anterior">←</button><div class="track"><div id="fill" class="fill"></div></div><span id="counter" class="counter"></span><button id="next" class="arrow" aria-label="Siguiente">→</button></div></section></main><footer class="footer">Use las flechas del teclado para avanzar</footer></div>
<script>
const decks=[
{title:"Correlación de Pearson",steps:[
["Modelo","Coeficiente de correlación",`$$r=\\frac{n\\sum XY-(\\sum X)(\\sum Y)}{\\sqrt{[n\\sum X^2-(\\sum X)^2][n\\sum Y^2-(\\sum Y)^2]}}$$`],
["Datos","Muestra y sumatorias",`$$n=1\\,347,\\quad\\sum X=5\\,477,\\quad\\sum Y=814\\,111\\,447$$<br>$$\\sum X^2=26\\,611,\\quad\\sum Y^2=1\\,500\\,860\\,744\\,345\\,361$$<br>$$\\sum XY=3\\,766\\,598\\,524$$`],
["Sustitución","Numerador",`$$N=1\\,347(3\\,766\\,598\\,524)-(5\\,477)(814\\,111\\,447)$$<br>$$N=5\\,073\\,608\\,211\\,828-4\\,458\\,888\\,395\\,219$$<br>$$N=614\\,719\\,816\\,609$$`],
["Sustitución","Denominador",`$$D_X=1\\,347(26\\,611)-(5\\,477)^2=5\\,847\\,488$$<br>$$D_Y=1\\,347(1\\,500\\,860\\,744\\,345\\,361)-(814\\,111\\,447)^2$$<br>$$D_Y=1\\,358\\,881\\,974\\,496\\,767\\,458$$`],
["Resultado","Correlación",`$$r=\\frac{614\\,719\\,816\\,609}{\\sqrt{(5\\,847\\,488)(1\\,358\\,881\\,974\\,496\\,767\\,458 )}}\\approx0.2181$$<div class="note">$$0&lt;r&lt;1,\\quad\\text{asociación positiva débil}$$</div>`],
["Contraste","Significancia",`$$t=\\frac{r\\sqrt{n-2}}{\\sqrt{1-r^2}}=8.1949,\\quad gl=1\\,345$$<br>$$\\alpha=0.05,\\quad t_{crítico}=\\pm1.962$$<br>$$R^2=r^2=0.0476=4.76\\%$$<div class="note">$$|t|&gt;1.962\\;\\Longrightarrow\\;\\text{rechazar }H_0$$<br>Relación significativa; correlación no implica causalidad.</div>`]]},
{title:"Regresión lineal · MCO",steps:[
["Modelo","Ecuación de regresión",`$$Y_i=\\beta_0+\\beta_1X_i+u_i$$<br>$$\\widehat Y_i=b_0+b_1X_i$$<br>$$\\widehat\\beta=(X'X)^{-1}X'Y$$`],
["Estimación","Mínimos cuadrados",`$$SC=\\sum(Y_i-\\widehat Y_i)^2\\;\\longrightarrow\\;\\min$$<br>$$b_1=\\frac{S_{xy}}{S_{xx}},\\qquad b_0=\\overline Y-b_1\\overline X$$`],
["Datos","Matriz y medias",`$$X'X=\\begin{pmatrix}1347&5477\\\\5477&26611\\end{pmatrix},\\quad X'Y=\\begin{pmatrix}814111447\\\\3766598524\\end{pmatrix}$$<br>$$\\overline X=4.0661,\\quad\\overline Y=604388.60$$`],
["Cálculo","Componentes centrados",`$$S_{xx}=\\sum X^2-\\frac{(\\sum X)^2}{n}=4341.1195$$<br>$$S_{xy}=\\sum XY-\\frac{(\\sum X)(\\sum Y)}{n}=456362150.415$$`],
["Sustitución","Coeficientes",`$$|X'X|=(1347)(26611)-(5477)^2=5847488$$<br>$$b_0=\\frac{26611(814111447)-5477(3766598524)}{5847488}=176940.8676$$<br>$$b_1=\\frac{-5477(814111447)+1347(3766598524)}{5847488}=105125.4516$$`],
["Resultado","Recta estimada",`$$\\widehat Y=176940.87+105125.45X$$<br>$$R^2=0.0476=4.76\\%$$<div class="note">Cada etapa adicional se asocia con $$105125.45$$ segundos más en la estimación. El modelo explica $$4.76\\%$$ de la variación.</div>`],
["Aplicación","Predicción para 4 etapas",`$$X=4$$<br>$$\\widehat Y=176940.87+105125.45(4)$$<br>$$\\widehat Y=597442.67\\;\\text{segundos}$$<br>$$\\frac{597442.67}{3600}=165.96\\;\\text{horas}$$`],
["Conclusión","Alcance del modelo",`$$\\beta_1>0,\\qquad R^2=4.76\\%$$<div class="note">Asociación positiva; capacidad explicativa baja. La recta describe una tendencia promedio, no prueba causalidad.</div>`]]},
{title:"Distribución de Poisson",steps:[
["Modelo","Probabilidad de conteo",`$$N_i\\sim\\operatorname{Poisson}(\\lambda)$$<br>$$P(N=k)=\\frac{e^{-\\lambda}\\lambda^k}{k!}$$`],
["Parámetro","Media diaria",`$$\\lambda=\\frac{\\text{incidencias}}{\\text{días}}=\\frac{1755}{73}=24.0411$$<div class="note">$$\\lambda\\approx24.04\\;\\text{incidencias por día}$$</div>`],
["Sustitución","Probabilidad de 24 incidencias",`$$P(N=24)=\\frac{e^{-24.0411}(24.0411)^{24}}{24!}$$`],
["Observados / esperados","Agrupación de días",`$$\\begin{array}{c|r|r|r}\\text{Intervalo}&F_o&P(\\text{intervalo})&F_e\\\\\\hline0\\text{–}20&25&0.2401&17.53\\\\21\\text{–}25&7&0.3886&28.37\\\\26+&41&0.3713&27.10\\\\\\text{Total}&73&1.0000&73.00\\end{array}$$`],
["Contraste","Bondad de ajuste chi-cuadrado",`$$\\chi^2=\\sum\\frac{(F_o-F_e)^2}{F_e}$$<br>$$\\chi_1^2=\\frac{(25-17.53)^2}{17.53}=3.18$$<br>$$\\chi_2^2=\\frac{(7-28.37)^2}{28.37}=16.10$$<br>$$\\chi_3^2=\\frac{(41-27.10)^2}{27.10}=7.13$$`],
["Resultado","Estadístico y decisión",`$$\\chi^2=3.18+16.10+7.13=26.41$$<br>$$gl=3-1-1=1,\\quad p=0.0000002765<0.05$$<div class="note">$$p<\\alpha\\;\\Longrightarrow\\;\\text{rechazar }H_0$$</div>`],
["Conclusión","Dispersión observada",`$$\\overline N=24.04,\\qquad s^2=256.10$$<br>$$s^2\\gg\\overline N$$<div class="note">Sobredispersión; Poisson simple no representa adecuadamente la variabilidad diaria.</div>`]]}];
let current=0,step=0;const menu=document.querySelector('#menu'),deck=document.querySelector('#deck');function render(){let d=decks[current],s=d.steps[step];document.querySelector('#exLabel').textContent=`Ejercicio 0${current+1}`;document.querySelector('#exTitle').textContent=d.title;document.querySelector('#stepLabel').textContent=`Paso 0${step+1} · ${d.steps.length}`;document.querySelector('#stepTitle').textContent=s[1];document.querySelector('#content').innerHTML=s[2];document.querySelector('#counter').textContent=`${step+1} / ${d.steps.length}`;document.querySelector('#fill').style.width=`${(step+1)/d.steps.length*100}%`;document.querySelector('#prev').disabled=step===0;document.querySelector('#next').disabled=step===d.steps.length-1;if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([document.querySelector('#content')]);}function open(i){current=i;step=0;menu.classList.add('hidden');deck.classList.remove('hidden');render()}function home(){deck.classList.add('hidden');menu.classList.remove('hidden')}document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>open(+b.dataset.ex));document.querySelector('#home').onclick=home;document.querySelector('#prev').onclick=()=>{if(step>0){step--;render()}};document.querySelector('#next').onclick=()=>{if(step<decks[current].steps.length-1){step++;render()}};document.addEventListener('keydown',e=>{if(deck.classList.contains('hidden'))return;if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();if(step<decks[current].steps.length-1){step++;render()}}if(['ArrowLeft','ArrowUp'].includes(e.key)){if(step>0){step--;render()}}if(e.key==='Escape')home()});
</script></body></html>
